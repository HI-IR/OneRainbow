[versions]
agp = "8.6.1"
converterGson = "2.9.0"
datastorePreferences = "1.0.0"
kotlin = "1.9.0"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
lifecycleLivedataKtx = "2.5.0"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
roomCompiler = "2.6.1"
roomKtx = "2.6.1"
securityCrypto = "1.1.0-alpha06"
viewbinding = "8.11.1"
roomRuntime = "2.6.1"
media3Session = "1.7.1"
pagingRuntime = "3.3.6"
pagingCommonAndroid = "3.3.6"
ksp = "1.9.10-1.0.13"
therouter = "1.2.4"
leakcanary = "2.8.1"
glide = "4.12.0"
swiperefreshlayout = "1.1.0"

# 应用基本数据
minSdk = "24"
targetSdk = "34"
compileSdk = "35"
namespace = "com.onerainbow.onerainbow"
versionCode = "1"
versionName = "1.0"


[libraries]
# ==================================================================================================
#                                           测试相关
# ==================================================================================================


junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
leakcanary = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

# ==================================================================================================
#                                           Android基础库
# ==================================================================================================
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycleLivedataKtx" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleLivedataKtx" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-viewbinding = { group = "androidx.databinding", name = "viewbinding", version.ref = "viewbinding" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }


# ==================================================================================================
#                                          组件
# ==================================================================================================
# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "converterGson" }

# media3
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3Session" }

# paging
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "pagingRuntime" }
androidx-paging-common-android = { group = "androidx.paging", name = "paging-common-android", version.ref = "pagingCommonAndroid" }

# therouter
room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomCompiler" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "roomKtx" }
therouter-apt = { group = "cn.therouter", name = "apt", version.ref = "therouter" }
therouter-router = { group = "cn.therouter", name = "router", version.ref = "therouter" }

# glide
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }

# datastore-preferences
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }

# security
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

# ==================================================================================================
#                                           构建工具相关库
# ==================================================================================================
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
therouter-agp = { id = "cn.therouter.agp8", version.ref = "therouter" }


# 约定插件
# 版本是用来符合语法占位的
onerainbow-application = { id = "com.onerainbow.android.application", version = "1.0.0" }
onerainbow-library = { id = "com.onerainbow.android.library", version = "1.0.0" }


[bundles]
projectBasic = [
    "androidx-core-ktx",
    "androidx-appcompat",
    "material",
    "androidx-activity",
    "androidx-constraintlayout",
    "androidx-swiperefreshlayout",
    "androidx-lifecycle-livedata-ktx",
    "androidx-lifecycle-viewmodel-ktx"
]